<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minimal PDF Watermarker</title>
    
    <!-- PDF.js (For rendering/Flattening) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <!-- PDF-Lib (PDF manipulation) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js"></script>
    <!-- JSZip (bulk download) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>

    <style>
        body { font-family: sans-serif; margin: 0; padding: 20px; display: flex; gap: 40px; box-sizing: border-box; }
        .sidebar { width: 340px; flex-shrink: 0; display: flex; flex-direction: column; gap: 15px; }
        .main { flex-grow: 1; display: flex; flex-direction: column; gap: 15px; }
        
        .row { display: flex; gap: 10px; align-items: center; }
        .col { display: flex; flex-direction: column; gap: 5px; }
        .grid-9 { display: grid; grid-template-columns: repeat(3, 30px); grid-template-rows: repeat(3, 30px); gap: 2px; }
        .grid-9 button { padding: 0; cursor: pointer; border: 1px solid #ccc; background: #fff; }
        .grid-9 button.active { background: #000; color: #fff; }
        
        fieldset { border: 1px solid #ccc; padding: 10px; margin: 0; }
        legend { font-weight: bold; font-size: 0.9em; padding: 0 5px; }
        
        .file-list { border: 1px solid #ccc; padding: 10px; height: 300px; overflow-y: auto; display: flex; flex-direction: column; gap: 5px; }
        .file-item { display: flex; justify-content: space-between; font-size: 0.9em; border-bottom: 1px solid #eee; padding-bottom: 5px; }
        
        input[type="number"] { width: 60px; }
        input[type="text"] { width: 100%; box-sizing: border-box; }
        input[type="color"] { padding: 0; width: 40px; height: 25px; cursor: pointer; }
        
        .small-note { font-size: 0.75em; color: #666; margin-top: 4px; }
        
        #statusText { 
            display: block; 
            margin-top: 10px; 
            font-family: monospace; 
            font-size: 0.9em; 
            color: #333; 
            background: #f4f4f4; 
            padding: 5px; 
            border: 1px solid #ddd; 
            min-height: 2em;
            word-break: break-all;
        }
    </style>
</head>
<body>

    <!-- LEFT SIDEBAR: Settings -->
    <div class="sidebar">
        
        <fieldset>
            <legend>Text Settings</legend>
            <div class="col">
                <label>Text:</label>
                <input type="text" id="textInput" value="CONFIDENTIAL">
                
                <div class="row" style="margin-top: 10px;">
                    <label>Size:</label>
                    <input type="range" id="fontSizeRange" min="8" max="150" value="50" style="flex-grow: 1;">
                    <input type="number" id="fontSizeNum" min="8" max="150" value="50">
                </div>

                <div class="row" style="margin-top: 10px;">
                    <label>Format:</label>
                    <input type="checkbox" id="boldCheck"> <label for="boldCheck">Bold</label>
                    <input type="checkbox" id="italicCheck"> <label for="italicCheck">Italic</label>
                    <input type="checkbox" id="underlineCheck"> <label for="underlineCheck">Underline</label>
                </div>

                <div class="row" style="margin-top: 10px;">
                    <label>Color:</label>
                    <input type="color" id="colorInput" value="#000000">
                </div>
            </div>
        </fieldset>

        <fieldset>
            <legend>Positioning</legend>
            <div class="row" style="align-items: flex-start;">
                <div class="col">
                    <label>Grid:</label>
                    <div class="grid-9" id="positionGrid"></div>
                </div>
                <div class="col" style="margin-left: 20px; margin-top: 20px;">
                    <label>
                        <input type="checkbox" id="mosaicCheck"> Mosaic
                    </label>
                </div>
            </div>
        </fieldset>

        <fieldset>
            <legend>Effects</legend>
            <div class="col gap-10">
                <div class="row">
                    <label style="width: 90px;">Transparency:</label>
                    <select id="transparencySelect">
                        <option value="1">None</option>
                        <option value="0.75">75%</option>
                        <option value="0.5" selected>50%</option>
                        <option value="0.25">25%</option>
                    </select>
                </div>
                <div class="row">
                    <label style="width: 90px;">Rotation:</label>
                    <select id="rotationSelect">
                        <option value="0">None</option>
                        <option value="45">45°</option>
                        <option value="90">90°</option>
                        <option value="-45">-45°</option>
                        <option value="-90">-90°</option>
                    </select>
                </div>
            </div>
        </fieldset>

        <fieldset>
            <legend>Pages & Output</legend>
            <div class="row">
                <label>From:</label>
                <input type="number" id="pageFrom" value="1" min="1">
                <label>To:</label>
                <input type="number" id="pageTo" value="999" min="1">
            </div>
            <div class="row" style="margin-top: 10px;">
                <input type="checkbox" id="flattenCheck">
                <label for="flattenCheck" style="font-weight: bold;">Flatten Output (Lossless)</label>
            </div>
            <div class="small-note">
                Applies the vector watermark first, then rasterizes all layers into a single high-resolution image (lossless PNG). This prevents the watermark from being removed.
            </div>
        </fieldset>

    </div>

    <!-- RIGHT MAIN: Processing -->
    <div class="main">
        
        <fieldset>
            <legend>Batch Queue</legend>
            <div class="row" style="margin-bottom: 10px;">
                <input type="file" id="fileInput" multiple accept=".pdf">
                <button id="clearBtn">Clear List</button>
            </div>
            
            <div class="file-list" id="fileList">
                <div style="color: #666; font-style: italic;">No files added yet.</div>
            </div>

            <div class="row" style="margin-top: 15px;">
                <button id="processBtn" style="padding: 8px 16px; font-weight: bold; cursor: pointer;">Process PDFs</button>
                <button id="downloadBtn" style="padding: 8px 16px; display: none; cursor: pointer;">Download ZIP</button>
            </div>
            
            <span id="statusText">Ready.</span>
        </fieldset>

    </div>

    <script>
        // Set PDF.js worker
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

        // --- State ---
        const state = {
            files: [],
            position: 4, // 0-8 (Center is 4)
            isProcessing: false,
            processedZip: null
        };

        // --- DOM Elements ---
        const dom = {
            textInput: document.getElementById('textInput'),
            fontSizeRange: document.getElementById('fontSizeRange'),
            fontSizeNum: document.getElementById('fontSizeNum'),
            boldCheck: document.getElementById('boldCheck'),
            italicCheck: document.getElementById('italicCheck'),
            underlineCheck: document.getElementById('underlineCheck'),
            colorInput: document.getElementById('colorInput'),
            positionGrid: document.getElementById('positionGrid'),
            mosaicCheck: document.getElementById('mosaicCheck'),
            transparencySelect: document.getElementById('transparencySelect'),
            rotationSelect: document.getElementById('rotationSelect'),
            pageFrom: document.getElementById('pageFrom'),
            pageTo: document.getElementById('pageTo'),
            flattenCheck: document.getElementById('flattenCheck'),
            fileInput: document.getElementById('fileInput'),
            fileList: document.getElementById('fileList'),
            clearBtn: document.getElementById('clearBtn'),
            processBtn: document.getElementById('processBtn'),
            downloadBtn: document.getElementById('downloadBtn'),
            statusText: document.getElementById('statusText')
        };

        // --- Initialize ---
        function init() {
            buildGrid();
            syncFontSize();
            attachEvents();
        }

        function buildGrid() {
            dom.positionGrid.innerHTML = '';
            for (let i = 0; i < 9; i++) {
                const btn = document.createElement('button');
                btn.textContent = i === state.position ? '●' : '';
                if (i === state.position) btn.classList.add('active');
                btn.onclick = () => {
                    if (dom.mosaicCheck.checked) return;
                    state.position = i;
                    buildGrid();
                };
                dom.positionGrid.appendChild(btn);
            }
        }

        function syncFontSize() {
            dom.fontSizeRange.addEventListener('input', (e) => dom.fontSizeNum.value = e.target.value);
            dom.fontSizeNum.addEventListener('input', (e) => dom.fontSizeRange.value = e.target.value);
        }

        function attachEvents() {
            dom.mosaicCheck.addEventListener('change', (e) => {
                dom.positionGrid.style.opacity = e.target.checked ? '0.3' : '1';
                dom.positionGrid.style.pointerEvents = e.target.checked ? 'none' : 'auto';
            });

            dom.fileInput.addEventListener('change', (e) => {
                const files = Array.from(e.target.files).filter(f => f.type === 'application/pdf');
                state.files = [...state.files, ...files];
                updateFileList();
            });

            dom.clearBtn.addEventListener('click', () => {
                state.files = [];
                updateFileList();
                dom.downloadBtn.style.display = 'none';
                dom.statusText.textContent = 'Ready.';
            });

            dom.processBtn.addEventListener('click', processPDFs);
            dom.downloadBtn.addEventListener('click', downloadZip);
        }

        function updateFileList() {
            if (state.files.length === 0) {
                dom.fileList.innerHTML = '<div style="color: #666; font-style: italic;">No files added yet.</div>';
                return;
            }
            dom.fileList.innerHTML = state.files.map((f, i) => `
                <div class="file-item">
                    <span>${f.name} (${(f.size / 1024 / 1024).toFixed(1)} MB)</span>
                    <button onclick="removeFile(${i})" style="cursor:pointer; background:none; border:none; color:red;">X</button>
                </div>
            `).join('');
        }

        window.removeFile = (index) => {
            state.files.splice(index, 1);
            updateFileList();
            dom.downloadBtn.style.display = 'none';
        };

        // --- Core Processing Logic ---
        async function processPDFs() {
            if (state.files.length === 0 || state.isProcessing) return;

            state.isProcessing = true;
            dom.processBtn.disabled = true;
            dom.downloadBtn.style.display = 'none';
            
            const updateStatus = (msg) => {
                dom.statusText.textContent = msg;
            };

            updateStatus('Starting batch process...');
            const zip = new JSZip();
            const isFlatten = dom.flattenCheck.checked;

            try {
                for (let i = 0; i < state.files.length; i++) {
                    const file = state.files[i];
                    updateStatus(`[File ${i + 1}/${state.files.length}] Reading: ${file.name}...`);
                    await new Promise(r => setTimeout(r, 50)); // Yield to allow UI paint

                    const arrayBuffer = await file.arrayBuffer();
                    let finalPdfBytes;

                    if (isFlatten) {
                        finalPdfBytes = await processFlattened(arrayBuffer, updateStatus);
                    } else {
                        finalPdfBytes = await processStandard(arrayBuffer, updateStatus);
                    }

                    updateStatus(`[File ${i + 1}/${state.files.length}] Adding to ZIP archive...`);
                    zip.file(file.name.replace('.pdf', '_watermarked.pdf'), finalPdfBytes);
                }

                updateStatus('Packaging ZIP file (this may take a moment)...');
                await new Promise(r => setTimeout(r, 50));
                
                const content = await zip.generateAsync({ type: "blob" });
                state.processedZip = content;
                
                updateStatus('Processing complete! Ready to download.');
                dom.downloadBtn.style.display = 'inline-block';

            } catch (err) {
                console.error(err);
                updateStatus('Error: ' + err.message);
                alert('Processing failed. See status box for details.');
            } finally {
                state.isProcessing = false;
                dom.processBtn.disabled = false;
            }
        }

        // --- 1. Shared Watermarking Engine (pdf-lib) ---
        async function applyWatermarkToPdf(arrayBuffer, updateStatus) {
            const { PDFDocument, StandardFonts, rgb, degrees } = PDFLib;
            
            updateStatus('Loading PDF document structure...');
            const pdfDoc = await PDFDocument.load(arrayBuffer, { ignoreEncryption: true });
            
            let fontType = StandardFonts.Helvetica;
            if (dom.boldCheck.checked && dom.italicCheck.checked) fontType = StandardFonts.HelveticaBoldOblique;
            else if (dom.boldCheck.checked) fontType = StandardFonts.HelveticaBold;
            else if (dom.italicCheck.checked) fontType = StandardFonts.HelveticaOblique;

            updateStatus('Embedding font data...');
            const font = await pdfDoc.embedFont(fontType);
            const pages = pdfDoc.getPages();
            
            const hex = dom.colorInput.value.replace('#', '');
            const color = rgb(
                parseInt(hex.substring(0, 2), 16) / 255, 
                parseInt(hex.substring(2, 4), 16) / 255, 
                parseInt(hex.substring(4, 6), 16) / 255
            );
            
            const text = dom.textInput.value;
            let size = parseInt(dom.fontSizeNum.value, 10);
            if (isNaN(size)) size = 50;
            
            const opacity = parseFloat(dom.transparencySelect.value);
            const rotate = degrees(parseInt(dom.rotationSelect.value, 10));
            const isMosaic = dom.mosaicCheck.checked;
            
            let startPage = parseInt(dom.pageFrom.value, 10) - 1;
            if (isNaN(startPage) || startPage < 0) startPage = 0;
            let endPage = parseInt(dom.pageTo.value, 10);
            if (isNaN(endPage) || endPage < 1) endPage = 9999;

            for (let p = 0; p < pages.length; p++) {
                if (p < startPage || p >= endPage) continue;
                
                updateStatus(`Applying vector watermark to page ${p + 1}...`);
                await new Promise(r => setTimeout(r, 10)); // Yield

                const page = pages[p];
                const { width, height } = page.getSize();
                const textWidth = font.widthOfTextAtSize(text, size);
                const textHeight = font.heightAtSize(size);

                if (isMosaic) {
                    const gapX = textWidth + 60;
                    const gapY = textHeight + 60;
                    for (let x = -width; x < width * 2; x += gapX) {
                        for (let y = -height; y < height * 2; y += gapY) {
                            page.drawText(text, { x, y, size, font, color, opacity, rotate });
                        }
                    }
                } else {
                    const pad = 40;
                    let x = pad, y = pad;
                    const col = state.position % 3, row = Math.floor(state.position / 3);
                    
                    if (col === 1) x = (width - textWidth) / 2;
                    if (col === 2) x = width - textWidth - pad;
                    
                    if (row === 0) y = height - textHeight - pad;
                    if (row === 1) y = (height - textHeight) / 2;
                    if (row === 2) y = pad;

                    if (rotate.angle !== 0) {
                        const rad = (rotate.angle * Math.PI) / 180;
                        x = x + (textWidth/2) - (textWidth/2)*Math.cos(rad) + (textHeight/2)*Math.sin(rad);
                        y = y + (textHeight/2) - (textWidth/2)*Math.sin(rad) - (textHeight/2)*Math.cos(rad);
                    }

                    page.drawText(text, { x, y, size, font, color, opacity, rotate });

                    if (dom.underlineCheck.checked) {
                        const rad = (rotate.angle * Math.PI) / 180;
                        page.drawLine({
                            start: { x, y: y - 2 },
                            end: { x: x + textWidth * Math.cos(rad), y: y - 2 + textWidth * Math.sin(rad) },
                            thickness: size / 15,
                            color: color,
                            opacity: opacity
                        });
                    }
                }
            }
            updateStatus('Saving watermarked PDF bytes...');
            return await pdfDoc.save();
        }

        // --- 2. Standard Output Mode ---
        async function processStandard(arrayBuffer, updateStatus) {
            return await applyWatermarkToPdf(arrayBuffer, updateStatus);
        }

        // --- 3. Flatten Output Mode ---
        async function processFlattened(arrayBuffer, updateStatus) {
            // Step 1: Apply Watermark first
            const watermarkedBytes = await applyWatermarkToPdf(arrayBuffer, updateStatus);
            
            // Step 2: Load into PDF.js to rasterize
            updateStatus('Initializing PDF.js rasterization engine...');
            const loadingTask = pdfjsLib.getDocument({ data: watermarkedBytes });
            const pdf = await loadingTask.promise;
            const newPdfDoc = await PDFLib.PDFDocument.create();
            
            const scale = 4.0; // ~288 DPI for high quality lossless output

            for (let p = 0; p < pdf.numPages; p++) {
                updateStatus(`Flattening: Rasterizing page ${p + 1} of ${pdf.numPages}...`);
                await new Promise(r => setTimeout(r, 10)); // Yield

                const page = await pdf.getPage(p + 1);
                const viewport = page.getViewport({ scale: scale });
                
                const canvas = document.createElement('canvas');
                const ctx = canvas.getContext('2d');
                canvas.width = Math.floor(viewport.width);
                canvas.height = Math.floor(viewport.height);

                // Render the watermarked PDF page
                await page.render({ canvasContext: ctx, viewport }).promise;

                updateStatus(`Flattening: Embedding page ${p + 1} as lossless PNG...`);
                await new Promise(r => setTimeout(r, 10)); // Yield

                const imgDataUrl = canvas.toDataURL('image/png');
                const imgBytes = await fetch(imgDataUrl).then(res => res.arrayBuffer());
                const img = await newPdfDoc.embedPng(imgBytes);
                
                const newPage = newPdfDoc.addPage([canvas.width / scale, canvas.height / scale]);
                newPage.drawImage(img, {
                    x: 0,
                    y: 0,
                    width: canvas.width / scale,
                    height: canvas.height / scale
                });
            }
            
            updateStatus('Flattening: Finalizing PDF document...');
            return await newPdfDoc.save();
        }

        function downloadZip() {
            if (!state.processedZip) return;
            const url = URL.createObjectURL(state.processedZip);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'watermarked_pdfs.zip';
            a.click();
            URL.revokeObjectURL(url);
        }

        // Start
        init();
    </script>
</body>
</html>
